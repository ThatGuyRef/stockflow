services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: stockflow
    ports:
    - "5433:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
    postgres_data: